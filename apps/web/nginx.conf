map $http_x_forwarded_proto $forwarded_proto {
 default $scheme;
 https https;
}
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 server_tokens off;
 client_max_body_size 100k;
 location = /healthz { access_log off; return 200 "ok\n"; }
 location /api/ {
  proxy_pass http://api:4000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  add_header Cache-Control "no-store" always;
 }
 location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
 location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
 location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
 location ~ /\. { deny all; }
 location / { try_files $uri $uri/ /index.html; }
}

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint:
      [
        "mongosh",
        "--host",
        "mongo:27017",
        "--quiet",
        "--eval",
        "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }",
      ]
    restart: on-failure
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/mam_chung?replicaSet=rs0
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY_HOPS: 1
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  mongo_data:

services:
  - type: web
    name: mam-chung
    runtime: node
    region: singapore
    plan: free
    branch: codex/deploy-render-free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/render-server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
